[package]
name          =  "fortex"
version       =  "0.0.1"
edition       =  "2021"
description   =  "FORTH/Cortex"
authors       = ["Dmitry Ponyatov <dponyatov@gmail.com","@dponyatov"]
license       =  "MIT"
homepage      =  "https://t.me/dponyatov"
documentation =  "https://docs.rs/fortex"
repository    =  "https://github.com/dponyatov/fortex"
keywords      = ["embedded", "forth", "cortex-m", "repl", "cli"]

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5.0"
panic-halt = "1.0.0"
panic-semihosting = { version = "0.6.0", features = ["exit"] }

[[bin]]
path  = "src/main.rs"
name  = "fortex"
test  = false
bench = false

[profile.release]
codegen-units = 1    # better optimizations
debug         = true # symbols are nice and they don't increase the size on Flash
lto           = true # better optimizations
